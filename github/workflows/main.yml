name: Build & Release AI Camera Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Auto-Fix V2 Android Structure
        run: |
          # 1. إزالة أي ملفات أندرويد قديمة تسبب التعارض
          rm -rf android
          
          # 2. إنشاء مجلد أندرويد الرسمي V2 المتطابق تماماً مع اسم مشروعك
          flutter create . --platforms=android --org com.example

          # 3. إنشاء كلاس MainActivity الرسمي المعتمد V2
          mkdir -p android/app/src/main/kotlin/com/example/edenia_ai_cam
          cat << 'EOF' > android/app/src/main/kotlin/com/example/edenia_ai_cam/MainActivity.kt
          package com.example.edenia_ai_cam

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 4. تحديث الـ minSdkVersion في gradle ليدعم كافة ميزات الكاميرا والذكاء الاصطناعي
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
