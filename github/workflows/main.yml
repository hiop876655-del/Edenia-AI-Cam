name: Build & Release AI Camera Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Complete Clean & Rebuild Android Engine
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.edenia_ai_cam
          cd android
          ./gradlew clean || true
          cd ..

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
