name: Build & Release AI Camera Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Auto-Migrate to V2 Flutter Embedding
        run: |
          mkdir -p android/app/src/main/kotlin/com/aicamera/recorder
          cat << 'EOF' > android/app/src/main/kotlin/com/aicamera/recorder/MainActivity.kt
          package com.aicamera.recorder

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          find android/app/src/main/java -type f -name "MainActivity.java" -delete 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
