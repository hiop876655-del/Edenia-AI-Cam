name: ai_camera_recorder_pro
description: "Ultra-fast offline AI Camera with HDR Burst Merge and Pro Screen Recorder with AudioPlaybackCapture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Camera & Vision (AI Face Detection & Segmentation)
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0

  # Offline AI / TFLite with GPU Delegate
  tflite_flutter: ^0.10.4

  # UI & Animations
  flutter_staggered_animations: ^1.1.1
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  image: ^4.1.7

  # System Utilities & Storage
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  vibration: ^1.8.4
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/real_esrgan_nano_int8.tflite
    - assets/ml/gfpgan_nano_int8.tflite
    - assets/ml/rnnoise_stream_int8.tflite
    - assets/ml/selfie_segmenter.tflite
